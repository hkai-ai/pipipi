services:
  business-api:
    image: ${PIPIPI_IMAGE:?PIPIPI_IMAGE is required}
    container_name: pipipi-business-api
    command: ["node", "dist/bin/crt-business-api.js"]
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${PIPIPI_ENV_FILE:-/opt/pipipi/shared/.env}
    volumes:
      - ${PIPIPI_BUSINESS_DATA_DIRECTORY:-/opt/pipipi/shared/crt-business-api}:/var/lib/pipipi-crt
    environment:
      NODE_ENV: production
      PORT: "4400"
      CRT_BUSINESS_API_HOST: "127.0.0.1"
      CRT_BUSINESS_API_PORT: "4400"
      CRT_IMAGE_WORK_DIRECTORY: /var/lib/pipipi-crt
      IMAGE_PROVIDER: fal
      OBJECT_STORAGE_PROVIDER: aliyun-oss
      CRT_IMAGE_EVIDENCE_MODE: "off"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    labels:
      com.pipipi.revision: ${PIPIPI_REVISION:?PIPIPI_REVISION is required}
      com.pipipi.role: business-api

  api:
    image: ${PIPIPI_IMAGE:?PIPIPI_IMAGE is required}
    container_name: pipipi
    restart: unless-stopped
    depends_on:
      business-api:
        condition: service_healthy
    network_mode: host
    env_file:
      - ${PIPIPI_ENV_FILE:-/opt/pipipi/shared/.env}
    volumes:
      - ${PIPIPI_RUN_RECORD_DIRECTORY:-/opt/pipipi/shared/run-records}:/var/lib/pipipi-run-records
      - ${PIPIPI_DATABASE_CA_FILE:-/opt/pipipi/shared/pg-server.crt}:/etc/pipipi/pg-server.crt:ro
    environment:
      NODE_ENV: production
      PORT: "4300"
      PIPIPI_REVISION: ${PIPIPI_REVISION:?PIPIPI_REVISION is required}
      ASYNC_PROCESS_RUNS_ENABLED: "false"
      CRT_BUSINESS_API_BASE_URL: http://127.0.0.1:4400
      # PostgreSQL is the production record store; DATABASE_URL comes from the
      # shared env file and must point sslrootcert at the mounted certificate.
      PROCESS_RUN_RECORD_STORE: postgres
      # Kept so switching back to the file store needs no Compose change.
      PROCESS_RUN_RECORD_DIRECTORY: /var/lib/pipipi-run-records
      PROCESS_RUN_RECORD_CONTENT: accepted-input-and-output
      CONSOLE_ENABLED: "true"
    labels:
      com.pipipi.revision: ${PIPIPI_REVISION:?PIPIPI_REVISION is required}
      com.pipipi.role: api
