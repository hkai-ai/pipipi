services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pipipi_test
      POSTGRES_USER: pipipi
      POSTGRES_PASSWORD: pipipi-test-only
    ports:
      - "${PIPIPI_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipipi -d pipipi_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
