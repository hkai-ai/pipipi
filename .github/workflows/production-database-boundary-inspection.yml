name: Production database boundary inspection
run-name: Database boundary for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      active_revision:
        description: Active production full commit SHA
        required: true
        type: string
      candidate_sha:
        description: Candidate image full commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect live database boundary without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-database-inspection
    concurrency:
      group: pipipi-production-release
      cancel-in-progress: false

    steps:
      - name: Validate revisions
        env:
          ACTIVE_REVISION: ${{ inputs.active_revision }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTIVE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production SSH target
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          ops/validate-production-ssh-target.sh \
            "$REMOTE_HOST" "$REMOTE_USER" "$REMOTE_PATH"

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Inspect database boundary
        env:
          ACTIVE_REVISION: ${{ inputs.active_revision }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 artifacts/production-database-inspection
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" bash -s -- \
            "$REMOTE_PATH" "$ACTIVE_REVISION" "$CANDIDATE_SHA" \
            < ops/inspect-production-database-boundary.sh \
            > artifacts/production-database-inspection/evidence.json

      - name: Upload inspection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pipipi-production-database-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-database-inspection/
          if-no-files-found: error
          retention-days: 30
