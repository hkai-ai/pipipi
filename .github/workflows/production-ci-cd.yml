name: Production CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate async production shape
        run: npm run check:deployment:async-shape

      - name: Build production image
        run: docker build --pull --tag "pipipi:${GITHUB_SHA}" .

      - name: Package production image
        if: github.event_name != 'pull_request'
        run: |
          docker save "pipipi:${GITHUB_SHA}" | gzip > "pipipi-${GITHUB_SHA}.image.tar.gz"
          cp compose.production.yaml "pipipi-${GITHUB_SHA}.compose.yaml"
          cp compose.production.async.yaml "pipipi-${GITHUB_SHA}.compose.async.yaml"

      - name: Upload release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pipipi-${{ github.sha }}
          path: |
            pipipi-${{ github.sha }}.image.tar.gz
            pipipi-${{ github.sha }}.compose.yaml
            pipipi-${{ github.sha }}.compose.async.yaml
          if-no-files-found: error
          retention-days: 7

  async-acceptance:
    name: Async durable acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASYNC_INTEGRATION_PROJECT_NAME: pipipi-async-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run durable async acceptance
        run: npm run test:acceptance:async:local

      - name: Clean isolated dependencies
        if: ${{ always() }}
        env:
          PIPIPI_POSTGRES_PORT: "0"
          PIPIPI_REDIS_PORT: "0"
        run: >-
          docker compose
          --project-name "$ASYNC_INTEGRATION_PROJECT_NAME"
          --file compose.integration.yaml
          down --volumes --remove-orphans

  news-image-change-check:
    name: Detect optional news image acceptance scope
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.changes.outputs.required }}

    steps:
      - name: Checkout candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect paid acceptance changes
        id: changes
        env:
          ACCEPTANCE_ENABLED: ${{ vars.NEWS_IMAGE_ACCEPTANCE_ENABLED }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          required=false
          if [[ "$ACCEPTANCE_ENABLED" == "true" ]]; then
            required=true
            if [[ "$GITHUB_EVENT_NAME" == "push" &&
                  "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ &&
                  ! "$BEFORE_SHA" =~ ^0{40}$ ]] &&
               git cat-file -e "$BEFORE_SHA^{commit}"; then
              if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
                .pi/skills/news-image-narrative-monument-prompt \
                .pi/skills/news-image-pale-watercolor-prompt \
                .pi/skills/news-image-raw-humanism-prompt \
                .github/workflows/production-ci-cd.yml \
                Dockerfile \
                compose.production.yaml \
                examples/news-image-business-acceptance.ts \
                package.json \
                package-lock.json \
                src/agent-runtime \
                src/app/api.ts \
                src/app/business-processes.ts \
                src/app/config.ts \
                src/release/news-image-acceptance.ts \
                src/app/runtime-skills.ts \
                src/bin/api.ts \
                src/bin/crt-business-api.ts \
                src/business-api \
                src/processes/catalog.ts \
                src/processes/news-image; then
                required=false
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  news-image-acceptance:
    name: Paid news image Business Process acceptance
    if: needs.news-image-change-check.outputs.required == 'true'
    needs:
      - ci
      - async-acceptance
      - news-image-change-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: news-image-acceptance
    concurrency:
      group: pipipi-production-release
      cancel-in-progress: false

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v6

      - name: Verify candidate revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install candidate dependencies
        run: npm ci

      - name: Run three approved news image Process journeys
        env:
          CRT_IMAGE_MODEL: gpt-image-2
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IMAGE_PROVIDER: fal
          NEWS_IMAGE_ACCEPTANCE_COST_APPROVAL_REFERENCE: github-run-${{ github.run_id }}-${{ github.run_attempt }}
          NEWS_IMAGE_ACCEPTANCE_COST_CONFIRMATION: APPROVE_THREE_NEWS_IMAGE_PROCESS_RUNS
          NEWS_IMAGE_ACCEPTANCE_COST_LIMIT_USD: ${{ vars.NEWS_IMAGE_ACCEPTANCE_COST_LIMIT_USD }}
          NEWS_IMAGE_ACCEPTANCE_EVIDENCE_FILE: artifacts/news-image-acceptance/evidence.json
          NEWS_IMAGE_ACCEPTANCE_EXPECTED_OSS_HOST: ${{ vars.NEWS_IMAGE_ACCEPTANCE_EXPECTED_OSS_HOST }}
          NEWS_IMAGE_ACCEPTANCE_EXPECTED_OSS_PATH_PREFIX: ${{ vars.NEWS_IMAGE_ACCEPTANCE_EXPECTED_OSS_PATH_PREFIX }}
          NEWS_IMAGE_ACCEPTANCE_REVISION: ${{ github.sha }}
          OBJECT_STORAGE_PROVIDER: aliyun-oss
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_MODE: ${{ vars.OPENAI_API_MODE || 'chat-completions' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_CNAME: ${{ vars.OSS_CNAME || 'false' }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_SIGNED_URL_TTL_SECONDS: "3600"
          OSS_STS_TOKEN: ${{ secrets.OSS_STS_TOKEN }}
          OSS_URL_ACCESS: signed
          PI_MODEL: ${{ vars.PI_MODEL }}
          PI_PROVIDER: openai
        run: npm run accept:news-image-business

      - name: Verify safe same-revision evidence
        if: ${{ always() }}
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_STS_TOKEN: ${{ secrets.OSS_STS_TOKEN }}
        run: |
          set -Eeuo pipefail
          evidence=artifacts/news-image-acceptance/evidence.json
          test -f "$evidence"
          jq --exit-status --arg revision "$GITHUB_SHA" '
            .schemaVersion == 1 and
            .event == "news_image_business_acceptance_completed" and
            .revision == $revision and .status == "succeeded" and
            .providers.image == "fal" and
            .providers.storage == "aliyun-oss" and
            .totals == {processRuns:3, imageGenerationAttempts:3} and
            (.processRuns | length) == 3 and
            ([.processRuns[].process.id] == [
              "news-image-narrative-monument",
              "news-image-pale-watercolor",
              "news-image-raw-humanism"
            ]) and
            ([.processRuns[].style] == [
              "narrative-monument",
              "pale-watercolor",
              "raw-humanism"
            ]) and
            ([.processRuns[]] | all(
              .process.version == "v1" and
              .processRunStatus == "succeeded" and
              (.runId | test("^[0-9a-f-]{36}$")) and
              .object.contentType == "image/png" and
              .object.width == 1600 and .object.height == 1200 and
              .object.bytes > 0 and
              (.object.contentSha256 | test("^[0-9a-f]{64}$")) and
              .object.expectedOssLocationVerified == true and
              .object.accessible == true
            ))
          ' "$evidence" >/dev/null
          for value in \
            "$FAL_KEY" "$OPENAI_API_KEY" "$OSS_ACCESS_KEY_ID" \
            "$OSS_ACCESS_KEY_SECRET" "$OSS_STS_TOKEN"; do
            if [[ -n "$value" ]]; then
              jq --exit-status --arg value "$value" \
                '(tostring | contains($value) | not)' "$evidence" >/dev/null
            fi
          done
          if jq -r '.. | objects | keys[]' "$evidence" | \
              grep -Eiq '(^|_)(url|prompt|secret|credential|authorization|payload|input|output|fal.?key|oss.?access)($|_)'; then
            echo "Forbidden news image acceptance evidence field detected" >&2
            exit 1
          fi

      - name: Upload news image acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pipipi-news-image-acceptance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/news-image-acceptance/evidence.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.ci.result == 'success' &&
      needs.async-acceptance.result == 'success' &&
      needs.news-image-change-check.result == 'success' &&
      ((needs.news-image-change-check.outputs.required == 'true' &&
        needs.news-image-acceptance.result == 'success') ||
       (needs.news-image-change-check.outputs.required != 'true' &&
        needs.news-image-acceptance.result == 'skipped'))
    needs:
      - ci
      - async-acceptance
      - news-image-change-check
      - news-image-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: pipipi-production-release
      cancel-in-progress: false

    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: pipipi-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Verify console gateway precondition
        env:
          CONSOLE_PUBLIC_URL: ${{ vars.CONSOLE_PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          const url = new URL(process.env.CONSOLE_PUBLIC_URL ?? "");
          if (
            url.protocol !== "https:" || url.username || url.password ||
            url.search || url.hash || url.pathname === "/"
          ) throw new Error("CONSOLE_PUBLIC_URL must be a protected HTTPS path");
          NODE
          base="${CONSOLE_PUBLIC_URL%/}"
          for suffix in "" "/processes" "/stats?hours=1"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 --proto '=https' \
              "$base$suffix")"
            [[ "$status" =~ ^(401|403)$ ]]
          done

      - name: Upload release to server
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "pipipi-${GITHUB_SHA}.image.tar.gz" \
            "pipipi-${GITHUB_SHA}.compose.yaml" \
            "$REMOTE_USER@$REMOTE_HOST:/tmp/"

      - name: Activate release
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" \
            bash -s -- "$REMOTE_PATH" "$GITHUB_SHA" \
              "/tmp/pipipi-${GITHUB_SHA}.image.tar.gz" \
              "/tmp/pipipi-${GITHUB_SHA}.compose.yaml" <<'REMOTE'
          set -Eeuo pipefail

          app_root="$1"
          revision="$2"
          image_archive="$3"
          compose_source="$4"
          image="pipipi:$revision"
          shared_env="$app_root/shared/.env"
          compose_file="$app_root/shared/compose.production.yaml"
          previous_compose="$app_root/shared/compose.production.previous.yaml"
          previous_image=""
          previous_revision=""
          previous_has_business="false"
          legacy_pm2="false"

          command -v docker >/dev/null
          docker compose version >/dev/null
          command -v flock >/dev/null

          mkdir -p "$app_root/shared"
          lock_file="$app_root/shared/deployment.lock"
          exec 9>"$lock_file"
          if ! flock -n 9; then
              echo "Another production deployment is active" >&2
              exit 1
          fi
          if [ -f "$app_root/shared/async-control/smoke-lease" ]; then
              echo "An async internal smoke is active" >&2
              exit 1
          fi

          if [ ! -f "$shared_env" ]; then
              echo "Missing production environment file: $shared_env" >&2
              exit 1
          fi

          install -d -m 700 -o 1000 -g 1000 \
              "$app_root/shared/crt-business-api"
          install -d -m 700 -o 1000 -g 1000 \
              "$app_root/shared/run-records"
          export PIPIPI_BUSINESS_DATA_DIRECTORY="$app_root/shared/crt-business-api"
          export PIPIPI_RUN_RECORD_DIRECTORY="$app_root/shared/run-records"
          export PIPIPI_DATABASE_CA_FILE="$app_root/shared/pg-server.crt"

          # The database certificate is public, but the deploy must not invent
          # one: a missing file would silently mount as a directory.
          if [ ! -f "$app_root/shared/pg-server.crt" ]; then
              echo "Missing database certificate: $app_root/shared/pg-server.crt" >&2
              exit 1
          fi

          # The default release cannot safely infer that accepted async Runs
          # have drained. An operator must first use the explicit async
          # rollback procedure, which removes these roles only after drain.
          for async_container in \
              pipipi-process-dispatcher \
              pipipi-process-worker \
              pipipi-webhook-worker \
              pipipi-retention-cleaner; do
              if docker inspect "$async_container" >/dev/null 2>&1; then
                  echo "Explicit async deployment is present; refusing an implicit synchronous rollback" >&2
                  exit 1
              fi
          done
          gzip -dc "$image_archive" | docker load

          docker run --rm --env-file "$shared_env" \
              --env IMAGE_PROVIDER=fal \
              --env OBJECT_STORAGE_PROVIDER=aliyun-oss \
              --entrypoint node "$image" \
              dist/bin/check-deployment-environment.js crt-business-api

          # The API records Runs into PostgreSQL, so its own required variables
          # are checked with the same Compose-owned values before anything is
          # replaced.
          docker run --rm --env-file "$shared_env" \
              --env PROCESS_RUN_RECORD_STORE=postgres \
              --env CONSOLE_ENABLED=true \
              --entrypoint node "$image" \
              dist/bin/check-deployment-environment.js api

          # Apply the schema before the new container serves, otherwise
          # recording fails silently: Run Record writes are best effort.
          docker run --rm --env-file "$shared_env" \
              --volume "$app_root/shared/pg-server.crt:/etc/pipipi/pg-server.crt:ro" \
              --entrypoint npm "$image" run db:migrate

          # A URL can name a restricted role while the session actually logs in
          # as a superuser and uses SET ROLE. Verify the live identity and TLS
          # boundary before replacing either production container.
          docker run --rm --env-file "$shared_env" \
              --volume "$app_root/shared/pg-server.crt:/etc/pipipi/pg-server.crt:ro" \
              --entrypoint npm "$image" run audit:production-database

          if docker inspect pipipi >/dev/null 2>&1; then
              previous_image="$(docker inspect pipipi --format '{{.Config.Image}}')"
              previous_revision="$(docker inspect pipipi --format '{{index .Config.Labels "com.pipipi.revision"}}')"
              if docker inspect pipipi-business-api >/dev/null 2>&1; then
                  previous_has_business="true"
              fi
          elif command -v pm2 >/dev/null && \
              pm2 describe pipipi >/dev/null 2>&1; then
              legacy_pm2="true"
          fi

          if [ -f "$compose_file" ]; then
              cp -p "$compose_file" "$previous_compose"
          fi
          install -m 600 "$compose_source" "$compose_file"

          activate() {
              target_image="$1"
              target_revision="$2"
              PIPIPI_IMAGE="$target_image" \
              PIPIPI_REVISION="$target_revision" \
              PIPIPI_ENV_FILE="$shared_env" \
                  docker compose --project-name pipipi \
                  --file "$compose_file" up -d --force-recreate --no-build

              actual_image="$(docker inspect pipipi --format '{{.Config.Image}}')"
              actual_revision="$(docker inspect pipipi --format '{{index .Config.Labels "com.pipipi.revision"}}')"
              business_image="$(docker inspect pipipi-business-api --format '{{.Config.Image}}')"
              business_revision="$(docker inspect pipipi-business-api --format '{{index .Config.Labels "com.pipipi.revision"}}')"
              if [ "$actual_image" != "$target_image" ] || \
                  [ "$actual_revision" != "$target_revision" ] || \
                  [ "$business_image" != "$target_image" ] || \
                  [ "$business_revision" != "$target_revision" ]; then
                  echo "Container revision mismatch" >&2
                  return 1
              fi
          }

          healthy_api() {
              curl --fail --silent --show-error \
                  http://127.0.0.1:4300/healthz >/dev/null && \
              curl --fail --silent --show-error \
                  http://127.0.0.1:4300/readyz >/dev/null && \
              curl --fail --silent --show-error \
                  http://127.0.0.1:4300/llms.txt | grep -Fq '# Pipipi Business Process API' && \
              curl --fail --silent --show-error \
                  http://127.0.0.1:4300/docs/api.md | grep -Fq '# 业务接口文档'
          }

          healthy() {
              attempt=1
              while [ "$attempt" -le 30 ]; do
                  if curl --fail --silent --show-error \
                      http://127.0.0.1:4400/healthz >/dev/null && \
                      curl --fail --silent --show-error \
                      http://127.0.0.1:4400/readyz >/dev/null && \
                      healthy_api; then
                      return 0
                  fi
                  attempt=$((attempt + 1))
                  sleep 2
              done
              return 1
          }

          rollback() {
              if [ -n "$previous_image" ]; then
                  echo "Rolling back to $previous_image" >&2
                  if [ "$previous_has_business" = "true" ]; then
                      activate "$previous_image" "$previous_revision"
                      healthy
                      return
                  fi
                  PIPIPI_IMAGE="$image" PIPIPI_REVISION="$revision" \
                  PIPIPI_ENV_FILE="$shared_env" \
                      docker compose --project-name pipipi \
                      --file "$compose_file" down
                  PIPIPI_IMAGE="$previous_image" \
                  PIPIPI_REVISION="$previous_revision" \
                  PIPIPI_ENV_FILE="$shared_env" \
                      docker compose --project-name pipipi \
                      --file "$previous_compose" up -d --force-recreate --no-build
                  healthy_api
                  return
              fi
              if [ "$legacy_pm2" = "true" ]; then
                  echo "Rolling back to the legacy PM2 deployment" >&2
                  PIPIPI_IMAGE="$image" PIPIPI_REVISION="$revision" \
                  PIPIPI_ENV_FILE="$shared_env" \
                      docker compose --project-name pipipi \
                      --file "$compose_file" down
                  legacy_release="$(readlink -f "$app_root/current")"
                  cd "$legacy_release"
                  pm2 start ecosystem.config.cjs --update-env
                  healthy_api
                  return
              fi
              echo "No previous deployment is available for rollback" >&2
              return 1
          }

          if [ "$legacy_pm2" = "true" ]; then
              pm2 delete pipipi >/dev/null 2>&1 || true
          fi

          if ! activate "$image" "$revision" || ! healthy; then
              docker logs --tail 100 pipipi || true
              docker logs --tail 100 pipipi-business-api || true
              rollback || true
              exit 1
          fi

          if [ "$legacy_pm2" = "true" ]; then
              pm2 save --force >/dev/null
          fi
          rm -f "$image_archive" "$compose_source" "$previous_compose"
          echo "Deployed revision $revision"
          REMOTE
