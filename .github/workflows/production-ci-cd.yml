name: Production CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package release
        if: github.event_name != 'pull_request'
        run: |
          tar -czf pipipi-release.tar.gz \
            dist \
            package.json \
            package-lock.json \
            ecosystem.config.cjs \
            .pi/skills

      - name: Upload release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pipipi-${{ github.sha }}
          path: pipipi-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: pipipi-production
      cancel-in-progress: false

    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: pipipi-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload release to server
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          scp -o StrictHostKeyChecking=no \
            pipipi-release.tar.gz \
            "$REMOTE_USER@$REMOTE_HOST:/tmp/pipipi-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o StrictHostKeyChecking=no \
            "$REMOTE_USER@$REMOTE_HOST" \
            bash -s -- "$REMOTE_PATH" "$GITHUB_SHA" "/tmp/pipipi-${GITHUB_SHA}.tar.gz" <<'REMOTE'
          set -Eeuo pipefail

          app_root="$1"
          revision="$2"
          archive="$3"
          release_dir="$app_root/releases/$revision"
          shared_env="$app_root/shared/.env"
          current_link="$app_root/current"
          previous_release=""

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
          fi
          nvm use 24
          command -v pm2 >/dev/null

          if [ ! -f "$shared_env" ]; then
              echo "Missing production environment file: $shared_env" >&2
              exit 1
          fi

          mkdir -p "$app_root/releases" "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          ln -sfn "$shared_env" "$release_dir/.env"

          cd "$release_dir"
          npm ci --omit=dev

          if [ -L "$current_link" ]; then
              previous_release="$(readlink -f "$current_link")"
          fi

          activate() {
              target="$1"
              ln -sfn "$target" "$app_root/current.next"
              mv -Tf "$app_root/current.next" "$current_link"
              cd "$target"
              pm2 delete pipipi >/dev/null 2>&1 || true
              pm2 start ecosystem.config.cjs --update-env

              pid="$(pm2 pid pipipi | head -n 1)"
              expected_cwd="$(readlink -f "$target")"
              if [ -z "$pid" ] || [ "$pid" = "0" ] || \
                  [ ! -d "/proc/$pid" ]; then
                  echo "PM2 did not start pipipi" >&2
                  return 1
              fi
              actual_cwd="$(readlink -f "/proc/$pid/cwd")"
              if [ "$actual_cwd" != "$expected_cwd" ]; then
                  echo "PM2 is running $actual_cwd, expected $expected_cwd" >&2
                  return 1
              fi
          }

          healthy() {
              attempt=1
              while [ "$attempt" -le 30 ]; do
                  if curl --fail --silent --show-error \
                      http://127.0.0.1:4300/healthz >/dev/null && \
                      curl --fail --silent --show-error \
                      http://127.0.0.1:4300/readyz >/dev/null; then
                      return 0
                  fi
                  attempt=$((attempt + 1))
                  sleep 2
              done
              return 1
          }

          rollback() {
              if [ -z "$previous_release" ] || [ ! -d "$previous_release" ]; then
                  echo "No previous release is available for rollback" >&2
                  return 1
              fi
              echo "Rolling back to $previous_release" >&2
              activate "$previous_release"
              healthy
          }

          if ! activate "$release_dir" || ! healthy; then
              pm2 logs pipipi --lines 100 --nostream || true
              rollback || true
              exit 1
          fi

          pm2 save
          rm -f "$archive"
          echo "Deployed revision $revision"
          REMOTE
