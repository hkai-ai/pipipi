name: UAT CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Check and build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build UAT image
        run: docker build --pull --tag "pipipi:${GITHUB_SHA}" .

      - name: Package UAT image
        run: |
          set -Eeuo pipefail
          docker save "pipipi:${GITHUB_SHA}" | gzip > "pipipi-${GITHUB_SHA}.image.tar.gz"
          cp compose.production.yaml "pipipi-${GITHUB_SHA}.compose.yaml"
          cp compose.production.async.yaml "pipipi-${GITHUB_SHA}.compose.async.yaml"
          cp ops/update-async-release.sh "pipipi-${GITHUB_SHA}.update-async.sh"
          cp ops/deploy-uat-release.sh "pipipi-${GITHUB_SHA}.deploy-uat.sh"

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: pipipi-uat-${{ github.sha }}
          path: |
            pipipi-${{ github.sha }}.image.tar.gz
            pipipi-${{ github.sha }}.compose.yaml
            pipipi-${{ github.sha }}.compose.async.yaml
            pipipi-${{ github.sha }}.update-async.sh
            pipipi-${{ github.sha }}.deploy-uat.sh
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy UAT
    needs: ci
    if: github.ref == 'refs/heads/develop' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: uat
    concurrency:
      group: pipipi-uat-release
      cancel-in-progress: false

    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: pipipi-uat-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.UAT_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_PRIVATE_KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            IPQoS none
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 15
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
          test -s ~/.ssh/known_hosts
          test -s ~/.ssh/deploy_key

      - name: Verify console gateway precondition
        env:
          CONSOLE_PUBLIC_URL: ${{ vars.UAT_CONSOLE_PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "${CONSOLE_PUBLIC_URL}" ]; then
            echo "UAT console URL is unset; skipping the public gateway check"
            exit 0
          fi
          node --input-type=module <<'NODE'
          const url = new URL(process.env.CONSOLE_PUBLIC_URL ?? "");
          if (
            url.protocol !== "https:" || url.username || url.password ||
            url.search || url.hash || url.pathname === "/"
          ) throw new Error("UAT_CONSOLE_PUBLIC_URL must be a protected HTTPS path");
          NODE
          base="${CONSOLE_PUBLIC_URL%/}"
          for suffix in "" "/processes" "/stats?hours=1"; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 --proto '=https' \
              "$base$suffix")"
            [[ "$status" =~ ^(401|403)$ ]]
          done

      - name: Upload release to UAT server
        env:
          REMOTE_HOST: ${{ vars.UAT_REMOTE_HOST }}
          REMOTE_USER: ${{ vars.UAT_REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$REMOTE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$REMOTE_USER" =~ ^[a-z][a-z0-9-]{0,31}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          remote_target="$REMOTE_USER@$REMOTE_HOST"
          image_archive="pipipi-${GITHUB_SHA}.image.tar.gz"
          remote_chunks="/tmp/pipipi-${GITHUB_SHA}.chunks"
          expected_sha="$(sha256sum "$image_archive" | awk '{print $1}')"
          image_bytes="$(stat -c%s "$image_archive")"
          echo "Uploading release metadata files and ${image_bytes} byte image (sha256=${expected_sha})"

          # 先上传体积很小的 compose 与脚本文件
          for attempt in 1 2 3; do
            if timeout 60 scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "pipipi-${GITHUB_SHA}.compose.yaml" \
              "pipipi-${GITHUB_SHA}.compose.async.yaml" \
              "pipipi-${GITHUB_SHA}.update-async.sh" \
              "$remote_target:/tmp/"; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
            echo "Metadata upload attempt ${attempt} failed; retrying..."
            sleep 3
          done

          # 将镜像包切为 8MB 分片，4 路并发流式上传并逐片校验 SHA-256，支持断线重试且实时输出进度
          chunk_dir="$(mktemp -d)"
          trap 'rm -rf "$chunk_dir"' EXIT
          split -b 8M -d -a 3 "$image_archive" "$chunk_dir/chunk-"
          total_chunks="$(find "$chunk_dir" -maxdepth 1 -name 'chunk-*' | wc -l | tr -d ' ')"
          echo "Split image into ${total_chunks} chunks (8MB each)"

          existing_manifest="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote_target" \
            "mkdir -p '$remote_chunks' && cd '$remote_chunks' && sha256sum chunk-* 2>/dev/null || true")"

          upload_chunk() {
            set -Eeuo pipefail
            local chunk_path="$1"
            local chunk_name
            chunk_name="$(basename "$chunk_path")"
            local chunk_sha
            chunk_sha="$(sha256sum "$chunk_path" | awk '{print $1}')"
            local chunk_bytes
            chunk_bytes="$(stat -c%s "$chunk_path")"

            if printf '%s\n' "$existing_manifest" | grep -Fxq "${chunk_sha}  ${chunk_name}"; then
              echo "Skipping ${chunk_name} (already verified on UAT server)"
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              local started_at
              started_at="$(date +%s)"
              if timeout 180 ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote_target" \
                "set -eu; dst='$remote_chunks/$chunk_name'; tmp=\"\$dst.part\"; cat > \"\$tmp\"; actual=\"\$(sha256sum \"\$tmp\" | awk '{print \$1}')\"; test \"\$actual\" = '$chunk_sha'; mv -f \"\$tmp\" \"\$dst\"" \
                < "$chunk_path"; then
                local elapsed=$(( $(date +%s) - started_at ))
                echo "Uploaded ${chunk_name} (${chunk_bytes} bytes) in ${elapsed}s (attempt ${attempt})"
                return 0
              fi
              echo "Chunk ${chunk_name} attempt ${attempt} failed; retrying..." >&2
              sleep $(( attempt * 2 ))
            done
            echo "Chunk ${chunk_name} failed after 5 attempts" >&2
            return 1
          }
          export -f upload_chunk
          export remote_target remote_chunks existing_manifest

          find "$chunk_dir" -maxdepth 1 -name 'chunk-*' -print0 \
            | sort -z \
            | xargs -0 -n 1 -P 4 bash -c 'upload_chunk "$1"' _

          echo "All ${total_chunks} chunks uploaded; assembling and verifying sha256 on UAT server..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote_target" "
            set -eu
            out='/tmp/pipipi-${GITHUB_SHA}.image.tar.gz'
            tmp=\"\$out.part\"
            cat '$remote_chunks'/chunk-* > \"\$tmp\"
            actual=\"\$(sha256sum \"\$tmp\" | awk '{print \$1}')\"
            test \"\$actual\" = '$expected_sha'
            mv -f \"\$tmp\" \"\$out\"
            rm -rf '$remote_chunks'
          "
          echo "Verified remote image sha256=${expected_sha}"

      - name: Configure template diagnostics for the API
        env:
          DIAGNOSTICS_TOKEN: ${{ secrets.UAT_TEMPLATE_DIAGNOSTICS_TOKEN }}
          REMOTE_HOST: ${{ vars.UAT_REMOTE_HOST }}
          REMOTE_USER: ${{ vars.UAT_REMOTE_USER }}
          REMOTE_PATH: ${{ vars.UAT_REMOTE_PATH }}
        run: |
          set -Eeuo pipefail
          if [ -z "${DIAGNOSTICS_TOKEN}" ]; then
            echo "UAT template diagnostics token is unset; leaving the server file unchanged"
            exit 0
          fi
          [[ "$DIAGNOSTICS_TOKEN" =~ ^[a-zA-Z0-9_+/=-]{32,512}$ ]]
          [[ "$REMOTE_PATH" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          printf 'MEMEBUY_TEMPLATE_DIAGNOSTICS_TOKEN=%s\n' "$DIAGNOSTICS_TOKEN" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_HOST" "
              set -eu
              cd '$REMOTE_PATH/shared'
              umask 077
              tmp=\$(mktemp .template-diagnostics.XXXXXXXX)
              trap 'rm -f -- \"\$tmp\"' EXIT
              cat > \"\$tmp\"
              mv -f -- \"\$tmp\" template-diagnostics.env
            "

      - name: Activate UAT release
        env:
          REMOTE_HOST: ${{ vars.UAT_REMOTE_HOST }}
          REMOTE_PATH: ${{ vars.UAT_REMOTE_PATH }}
          REMOTE_USER: ${{ vars.UAT_REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$REMOTE_PATH" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" \
            bash -s -- "$REMOTE_PATH" "$GITHUB_SHA" \
              "/tmp/pipipi-${GITHUB_SHA}.image.tar.gz" \
              "/tmp/pipipi-${GITHUB_SHA}.compose.yaml" \
              "/tmp/pipipi-${GITHUB_SHA}.compose.async.yaml" \
              "/tmp/pipipi-${GITHUB_SHA}.update-async.sh" \
            < "pipipi-${GITHUB_SHA}.deploy-uat.sh"
