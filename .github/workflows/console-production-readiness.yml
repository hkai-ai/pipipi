name: Console production readiness
run-name: Console readiness for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Active production full commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify protected console and durable observation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: console-production-readiness
    concurrency:
      group: pipipi-production-release
      cancel-in-progress: false

    steps:
      - name: Validate candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify active database identity and backup evidence
        id: server
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 artifacts/console-production-readiness
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" bash -s -- \
            "$REMOTE_PATH" "$CANDIDATE_SHA" \
            < ops/collect-console-production-server-evidence.sh \
            > artifacts/console-production-readiness/server.json

      - name: Inspect console gateway host
        id: gateway_host
        if: ${{ failure() && steps.server.outcome == 'failure' }}
        env:
          CONSOLE_PUBLIC_URL: ${{ vars.CONSOLE_PUBLIC_URL }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 artifacts/console-production-readiness
          target="$(node --input-type=module --eval '
            const url = new URL(process.env.CONSOLE_PUBLIC_URL ?? "");
            if (
              url.protocol !== "https:" || url.username || url.password ||
              url.search || url.hash || url.pathname === "/"
            ) throw new Error("CONSOLE_PUBLIC_URL must be a protected HTTPS path");
            console.log(JSON.stringify({
              domain: url.hostname,
              publicPath: url.pathname.replace(/\/$/, ""),
            }));
          ')"
          domain="$(jq -r '.domain' <<< "$target")"
          public_path="$(jq -r '.publicPath' <<< "$target")"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" bash -s -- "$domain" "$public_path" \
            < ops/collect-console-gateway-host-evidence.sh \
            > artifacts/console-production-readiness/gateway-host.json

      - name: Inspect effective gateway directives
        if: ${{ always() && steps.server.outcome == 'failure' && steps.gateway_host.outcome == 'success' }}
        env:
          CONSOLE_PUBLIC_URL: ${{ vars.CONSOLE_PUBLIC_URL }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
        run: |
          set -Eeuo pipefail
          container="$(jq -er '
            .reloadAdapter.containerNames
            | select(length == 1)
            | .[0]
          ' artifacts/console-production-readiness/gateway-host.json)"
          domain="$(node --input-type=module --eval '
            const url = new URL(process.env.CONSOLE_PUBLIC_URL ?? "");
            if (url.protocol !== "https:" || url.username || url.password) {
              throw new Error("CONSOLE_PUBLIC_URL must be HTTPS without userinfo");
            }
            console.log(url.hostname);
          ')"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" bash -s -- "$container" "$domain" \
            < ops/collect-console-effective-gateway-evidence.sh \
            > artifacts/console-production-readiness/effective-gateway.json

      - name: Verify console gateway authentication
        id: gateway
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONSOLE_AUTHORIZATION: ${{ secrets.CONSOLE_AUTHORIZATION }}
          CONSOLE_PUBLIC_URL: ${{ vars.CONSOLE_PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' > artifacts/console-production-readiness/gateway.json
          import { createHash } from "node:crypto";
          const url = new URL(process.env.CONSOLE_PUBLIC_URL ?? "");
          if (
            url.protocol !== "https:" || url.username || url.password ||
            url.search || url.hash || url.pathname === "/"
          ) throw new Error("CONSOLE_PUBLIC_URL must be a protected HTTPS path");
          if (!process.env.CONSOLE_AUTHORIZATION || /[\r\n]/.test(process.env.CONSOLE_AUTHORIZATION)) {
            throw new Error("CONSOLE_AUTHORIZATION is required");
          }
          const authorization = process.env.CONSOLE_AUTHORIZATION;
          const probes = ["", "/processes", "/stats?hours=1"];
          const anonymousStatus = [];
          const authenticatedStatus = [];
          const bodies = [];
          for (const suffix of probes) {
            const target = `${url.href.replace(/\/$/, "")}${suffix}`;
            const anonymous = await fetch(target, { redirect: "manual" });
            if (anonymous.status !== 401 && anonymous.status !== 403) {
              throw new Error(`Anonymous Console request was not rejected: ${suffix}`);
            }
            anonymousStatus.push(anonymous.status);
            const authenticated = await fetch(target, {
              headers: { authorization },
              redirect: "manual",
            });
            if (authenticated.status !== 200) {
              throw new Error(`Authenticated Console request failed: ${suffix}`);
            }
            if (authenticated.headers.get("x-pipipi-revision") !== process.env.CANDIDATE_SHA) {
              throw new Error(`Console gateway revision mismatch: ${suffix}`);
            }
            authenticatedStatus.push(authenticated.status);
            bodies.push({
              contentType: authenticated.headers.get("content-type") ?? "",
              body: await authenticated.text(),
            });
          }
          if (!bodies[0].contentType.includes("text/html") ||
              !bodies[0].body.includes("<title>Business Process 控制台</title>") ||
              !bodies[0].body.includes('id="console"')) {
            throw new Error("Console document contract is invalid");
          }
          const processes = JSON.parse(bodies[1].body);
          if (!bodies[1].contentType.includes("application/json") ||
              !Array.isArray(processes.processes) || processes.processes.length === 0 ||
              !processes.processes.every((entry) =>
                typeof entry.process === "string" && typeof entry.version === "string" &&
                Array.isArray(entry.activities))) {
            throw new Error("Console Process catalog contract is invalid");
          }
          const stats = JSON.parse(bodies[2].body);
          if (!bodies[2].contentType.includes("application/json") ||
              typeof stats.totals?.succeeded !== "number" ||
              typeof stats.totals?.failed !== "number" ||
              !Array.isArray(stats.byDay) || !Array.isArray(stats.recentFailures) ||
              typeof stats.concurrency?.active !== "number" ||
              typeof stats.concurrency?.limit !== "number") {
            throw new Error("Console statistics contract is invalid");
          }
          console.log(JSON.stringify({
            gateway: {
              identitySha256: createHash("sha256").update(url.href.replace(/\/$/, "")).digest("hex"),
              anonymousStatus,
              authenticatedStatus,
              revision: process.env.CANDIDATE_SHA,
              documentVerified: true,
              processCatalogVerified: true,
              statisticsVerified: true,
            },
          }));
          NODE

      - name: Assemble readiness evidence
        id: assemble
        env:
          BACKUP_EVIDENCE_HMAC_KEY: ${{ secrets.BACKUP_EVIDENCE_HMAC_KEY }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { createHmac, timingSafeEqual } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const key = process.env.BACKUP_EVIDENCE_HMAC_KEY ?? "";
          if (Buffer.byteLength(key, "utf8") < 32) {
            throw new Error("BACKUP_EVIDENCE_HMAC_KEY must be at least 32 bytes");
          }
          const server = JSON.parse(await readFile("artifacts/console-production-readiness/server.json", "utf8"));
          const backup = server.backup;
          const payload = [
            "1", "postgres_backup_verified", "succeeded",
            backup.databaseIdentitySha256, backup.backupId, backup.completedAt,
            backup.restoreVerifiedAt, backup.retentionUntil,
          ].join("\0");
          const expected = createHmac("sha256", key).update(payload).digest();
          if (typeof backup.signatureSha256 !== "string" ||
              !/^[0-9a-f]{64}$/.test(backup.signatureSha256)) {
            throw new Error("Backup evidence signature is invalid");
          }
          const received = Buffer.from(backup.signatureSha256, "hex");
          if (!timingSafeEqual(expected, received)) {
            throw new Error("Backup evidence signature does not match");
          }
          NODE
          jq -n \
            --arg revision "$CANDIDATE_SHA" \
            --slurpfile server artifacts/console-production-readiness/server.json \
            --slurpfile gateway artifacts/console-production-readiness/gateway.json '
            {
              schemaVersion: 1,
              event: "console_production_readiness_verified",
              revision: $revision,
              status: "succeeded",
              database: $server[0].database,
              backup: $server[0].backup,
              gateway: $gateway[0].gateway
            }
          ' > artifacts/console-production-readiness/evidence.json
          jq --exit-status --arg revision "$CANDIDATE_SHA" '
            .revision == $revision and .status == "succeeded" and
            .database.tlsVerified == true and
            .database.dedicatedDatabaseVerified == true and
            .database.nonSuperuserVerified == true and
            .database.administrativePrivilegesAbsent == true and
            .database.otherDatabaseAccessAbsent == true and
            .database.roleMembershipAbsent == true and
            .database.roleSwitchingAbsent == true and
            .database.databaseIdentitySha256 == .backup.databaseIdentitySha256 and
            .gateway.documentVerified == true and
            .gateway.processCatalogVerified == true and
            .gateway.statisticsVerified == true and
            (.gateway.anonymousStatus | all(. == 401 or . == 403)) and
            (.gateway.authenticatedStatus | all(. == 200))
          ' artifacts/console-production-readiness/evidence.json >/dev/null

      - name: Record failed readiness gate
        if: ${{ failure() }}
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
        run: |
          set -Eeuo pipefail
          directory=artifacts/console-production-readiness
          install -d -m 700 "$directory"
          revision=""
          failure_gate="invalid_candidate"
          if [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            revision="$CANDIDATE_SHA"
            failure_gate="preflight"
          fi
          if [ "$SERVER_OUTCOME" = "failure" ]; then
            failure_gate="$(jq -r '
              select(.event == "console_server_readiness_failed") |
              .failureGate // empty
            ' "$directory/server.json" 2>/dev/null || true)"
            failure_gate="${failure_gate:-server_readiness}"
          elif [ "$GATEWAY_OUTCOME" = "failure" ]; then
            failure_gate="gateway_authentication"
          elif [ "$ASSEMBLE_OUTCOME" = "failure" ]; then
            failure_gate="backup_signature"
          fi
          jq -n \
            --arg revision "$revision" \
            --arg failureGate "$failure_gate" \
            --arg serverOutcome "$SERVER_OUTCOME" \
            --arg gatewayOutcome "$GATEWAY_OUTCOME" \
            --arg assembleOutcome "$ASSEMBLE_OUTCOME" '
            {
              schemaVersion: 1,
              event: "console_production_readiness_failed",
              revision: (if $revision == "" then null else $revision end),
              status: "failed",
              failureGate: $failureGate,
              steps: {
                server: $serverOutcome,
                gateway: $gatewayOutcome,
                assemble: $assembleOutcome
              }
            }
          ' > "$directory/failure.json"

      - name: Upload readiness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pipipi-console-production-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/console-production-readiness/
          if-no-files-found: error
          retention-days: 90
